<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try {
      var t = localStorage.getItem("fox-theme");
      if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Blogs — Where Stories Come to Life</title>
  <meta name="description" content="Fox Blogs: articles for curious minds, built with React and Firebase." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fox Blogs — Where Stories Come to Life" />
  <meta property="og:description" content="Articles for curious minds. A full-stack blogging platform built with React, Vite and Firebase." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#ff9800" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
